# This file exists so that the repository root is pytest's rootdir whichever test folder is named on the command line
# (`pytest providers/secrets/tests` as much as the whole list of `python3 scripts/test_dirs.py`): without an ini-file
# pytest stops looking for conftest.py files above the folders it was given, and the root conftest.py, which forces the
# null keyring backend so that no test reads the real secret store, would not be loaded. It sets no option.
[pytest]
