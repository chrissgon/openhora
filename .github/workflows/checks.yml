# The same checks as .githooks/pre-commit, for every push to main and every pull request.
# Actions are pinned to a commit (tags can move); Dependabot proposes updates.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan reads every commit; the version rules read the pull request's base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Conventions and security scan
        run: python3 scripts/validate.py
        env:
          # The version rules read a change against the pull request's base, as the hook does with the merge
          # base of the default branch; on a push to main it is empty and the validator takes that merge base.
          WB_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Security scan, warnings included
        run: python3 scripts/security_scan.py --strict
      - name: Secrets in history
        run: python3 scripts/security_scan.py --history

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: Scanner and provider tests
        run: uv run --with pytest==9.1.1 pytest -q $(python3 scripts/test_dirs.py)

  # The scheduler starts the runtime, and the runtime starts these scripts, with the system interpreter
  # (Python 3.9 on macOS): providers/CONTRACT.md, "Python version". Only their tests run here; the rest of
  # the suite needs a newer Python. pytest 9 needs Python 3.10, so this job pins the last release for 3.9.
  # shared/scripts/tests holds the tests of the scripts those skills carry as generated copies (the contrast
  # check among them, whose test moved there from skills/brand-identity/scripts/tests).
  python39:
    name: python39
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.9"
      - name: The scripts the scheduler starts, on Python 3.9
        run: >-
          uv run --python 3.9 --with pytest==8.4.2 pytest -q
          scripts/tests/test_runtime_python39.py scripts/tests/test_provider_resolve.py
          scripts/tests/test_runtime.py scripts/tests/test_runtime_vote.py
          skills/mkt-engage/scripts/tests skills/mkt-publish/scripts/tests
          skills/mkt-vote-round/scripts/tests skills/brand-identity/scripts/tests
          shared/scripts/tests
          runtime/tests
          providers/store/tests providers/scheduler/tests

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: The eval container, built and exercised (no model call)
        run: WB_EVAL_DOCKER_TESTS=1 uv run --with pytest==9.1.1 pytest -q evals/tests/test_executor_docker.py evals/tests/test_keyproxy_docker.py
