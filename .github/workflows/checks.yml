# The same checks as .githooks/pre-commit, for every push to main and every pull request.
# Actions are pinned to a commit (tags can move); Dependabot proposes updates.
#
# Which tests run (docs/decisions.md, 2026-10-20 and the entry of T3): ONE required job, `tests`, which is a required check of the main
# ruleset, and so is never skipped (nor is `validate`, the other one): any label reruns both. DURING DEVELOPMENT, on a pull request
# into a branch other than main, `tests` runs only the SELECTED tests (scripts/select_tests.py: the tests of what the pull request
# changed, plus a fixed set of guards). At the end of a large delivery the WHOLE SUITE (with the full fuzz) runs instead: on a push
# to main, on a pull request into main, on a manual run (workflow_dispatch, on any branch: the supervisor runs it on the integration
# branch at the end of a phase), and on a pull request that carries the label `full-suite` (adding the label starts the jobs, which
# is why `labeled` is a trigger). The whole suite runs in three shard jobs (`tests-shard`, check runs `tests shard <k> of 3`, by
# scripts/shard_tests.py: round-robin by item, no stored durations), and the one required check `tests` is their aggregator
# (`if: always()`, `needs: tests-shard`): it fails unless every shard succeeded. The steps carry the condition, never `tests` itself:
# `always()` is the condition that never skips. The jobs that need docker or Go run when the paths they depend on changed, and
# always in those four cases.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A label added to a pull request starts a run of its own (below, every job but those of the whole suite is skipped on it), and must
# not cancel the run of the last push: so the two kinds of run are in two groups, and a label run is never cancelled by another label
# (it may be a whole-suite run in progress).
concurrency:
  group: checks-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event.action != 'labeled' }}

jobs:
  validate:
    name: validate
    # No skipping `if:` on this job or on `tests` (which has only `if: always()`, the condition that never skips): they are the required
    # checks of the main ruleset, and a job skipped by its condition is reported as passing on the same commit, so a label added to a
    # pull request could hide a red check. A label reruns them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan reads every commit; the version rules read the pull request's base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Conventions and security scan
        run: python3 scripts/validate.py
        env:
          # The version rules read a change against the pull request's base, as the hook does with the merge
          # base of the default branch; on a push to main it is empty and the validator takes that merge base.
          WB_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Security scan, warnings included
        run: python3 scripts/security_scan.py --strict
      - name: Secrets in history
        run: python3 scripts/security_scan.py --history

  # The whole suite in three shards (docs/decisions.md, the entry of T3): each job runs the same list with WB_FULL_FUZZ=1 and keeps the
  # K-th of 3 items of the collection (scripts/shard_tests.py, scripts/pytest_plugins/wb_shard.py). Every collected item is in exactly
  # one shard; the job `tests` below is the one required check and fails unless every shard succeeded. The condition is the whole-suite
  # condition of `tests`, word for word (scripts/tests/test_checks_wiring.py holds them equal).
  tests-shard:
    name: tests shard ${{ matrix.shard }} of 3
    if: >-
      github.event_name != 'pull_request' || github.base_ref == 'main'
      || contains(github.event.pull_request.labels.*.name, 'full-suite')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # as the whole suite has always run: tests may read the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: Scanner and provider tests, the whole suite
        env:
          WB_FULL_FUZZ: "1"
          SHARD: ${{ matrix.shard }}
        run: >-
          uv run --with pytest==9.1.1 --with pytest-xdist==3.8.0 python scripts/shard_tests.py --shard "$SHARD/3" --
          -q -n auto -o faulthandler_timeout=120 --durations=20 $(python3 scripts/test_dirs.py)

  # The one required check, the aggregator of the shards. Two modes, chosen by the `if:` of its steps (never of the job, which is never
  # skipped, on any event, so that the check exists and means something on every run; a label added to a pull request reruns it in
  # the mode its base asks for): the SELECTED tests of a pull request into a branch other than main (scripts/select_tests.py, rules at
  # the top of the file: it reads the files the pull request changed since its merge base with the base and prints the test files
  # that can reach them, plus the fixed guards; when it cannot compute the diff it selects every test folder), and the WHOLE SUITE
  # (every test folder, and the fuzz of the natural writes walked line by line: WB_FULL_FUZZ=1, about eight minutes of one process,
  # runtime/README.md, "The natural-writes fuzz") on a push to main, a pull request into main, a manual run and a pull request
  # labelled full-suite. In the whole mode the tests run in the jobs `tests-shard` above, and the step "The whole suite, every shard
  # passed" fails unless `needs.tests-shard.result` is `success` (a matrix is `success` only when every leg is: a failed, cancelled,
  # timed-out or skipped shard fails the check). `if: always()` is required: without it a failed shard makes GitHub skip this job,
  # and a skipped required check counts as passing. The whole suite is the end of a large delivery: it catches what the selected tests
  # cannot see (a dynamic import, a long call chain without an import edge). The tests are split across the runner's processes
  # (pytest-xdist, `-n auto`: one worker per vCPU, four on a public repository's runner; the whole suite in one process took 18 to
  # 19 minutes). --durations lists the slowest tests. The limit leaves headroom for a slow runner or a worker that waits on a
  # timeout; the selected run is far shorter.
  tests:
    name: tests
    needs: tests-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the selector reads the merge base with the pull request's base
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: Choose the tests this pull request can reach
        if: >-
          github.event_name == 'pull_request' && github.base_ref != 'main'
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash # bash -e -o pipefail: a failing selector fails the step, not only `tee`
        run: python3 scripts/select_tests.py --base "$BASE_SHA" --explain | tee "$RUNNER_TEMP/selected-tests.txt"
      - name: Selected scanner, provider, runtime and script tests
        if: >-
          github.event_name == 'pull_request' && github.base_ref != 'main'
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        run: uv run --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n auto -o faulthandler_timeout=120 --durations=20 $(cat "$RUNNER_TEMP/selected-tests.txt")
      - name: The whole suite, every shard passed
        if: >-
          github.event_name != 'pull_request' || github.base_ref == 'main'
          || contains(github.event.pull_request.labels.*.name, 'full-suite')
        env:
          SHARDS: ${{ needs.tests-shard.result }}
        run: |
          echo "the shards of the whole suite: $SHARDS"
          test "$SHARDS" = "success"

  # Which of the docker and Go jobs have anything to check: on a pull request into a branch other than main, those whose paths changed;
  # in the four cases of the whole suite, all of them. The paths are what each job's tests read: the eval container and its adapters,
  # the converter and exporter images and the workcopy scan, the WhatsApp program. This file counts for all three.
  changes:
    name: changes
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container: ${{ steps.paths.outputs.container }}
      converter: ${{ steps.paths.outputs.converter }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base of the pull request is read
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          set -eu
          everything=false
          if [ "$EVENT" != "pull_request" ] || [ "$ACTION" = "labeled" ] || [ "$BASE_REF" = "main" ] || [ "$FULL_LABEL" = "true" ]; then
            everything=true
          fi
          changed=""
          if [ "$everything" = "false" ]; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          fi
          touched() { [ "$everything" = "true" ] || printf '%s\n' "$changed" | grep -Eq "$1"; }
          container=false; converter=false; go=false
          touched '^(evals/|adapters/|shared/|skills/[^/]+/evals/|providers/secrets/|scripts/stage_skills.py|runtime/workcopy.py|.github/workflows/checks.yml)' && container=true
          touched '^(providers/converter/|providers/exporter/|runtime/workcopy.py|providers/[^/]*[.]py|.github/workflows/checks.yml)' && converter=true
          touched '^(providers/messenger/whatsapp/|.github/workflows/checks.yml)' && go=true
          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "converter=$converter" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # The scheduler starts the runtime, and the runtime starts these scripts, with the system interpreter
  # (Python 3.9 on macOS): providers/CONTRACT.md, "Python version". Only their tests run here; the rest of
  # the suite needs a newer Python. pytest 9 needs Python 3.10, so this job pins the last release for 3.9.
  # The list is scripts/python39_tests.txt, written once: this job and the nightly's nightly-python39 read it.
  # TWO MODES (docs/decisions.md, T4). SELECTED: on a pull request into a branch other than main without the label `full-suite`,
  # `scripts/select_tests.py --within scripts/python39_tests.txt` keeps the tests the change can reach that are inside the list, and
  # the guard scripts/tests/test_runtime_python39.py is always among them (rule 6), so every pull request still parses and imports
  # every runtime module on Python 3.9. WHOLE: a push to main, a pull request into main (the release), a manual run, the label
  # `full-suite`, and a selected-mode pull request that touches what decides the selection (.github/workflows/**, the list,
  # select_tests.py, a conftest.py, pytest.ini, pyproject.toml): the whole list, as the nightly runs it. The accepted cost, decided
  # by the maintainer 2026-10-24: a 3.9-only break that shows only when unselected code RUNS (a call-time API such as
  # `zip(strict=...)`) is found by the nightly within 24 hours, and before any release; a break at definition time (syntax, an
  # evaluated `X | None`, a missing import) is still caught on every pull request by the guard.
  # The tests are split across the runner's processes (pytest-xdist 3.8.0 supports Python 3.9; `-n auto`: one worker per
  # vCPU). Run in one process the whole list took 12 to 15 minutes and ran into the old 15-minute limit. The entry replay
  # (about 985 end-to-end scenarios) then took the job to 17 to 23 minutes and a 25-minute limit cancelled it; the limit is
  # 40 minutes (docs/decisions.md, CI39). WB_SKIP_JS_ONLY_TESTS=1 leaves out the test_interface_*.py files that only drive Node
  # over JavaScript and CSS (runtime/tests/conftest.py says which): Python's version changes nothing for them, and the
  # tests job runs them. Every test of a Python module stays here.
  python39:
    name: python39
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the selector reads the merge base with the pull request's base
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.9"
      - name: Choose the python39 tests this pull request can reach
        if: >-
          github.event_name == 'pull_request' && github.base_ref != 'main'
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash # bash -e -o pipefail: a failing selector fails the step, not only `tee`
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          # PY39_WHOLE_PATHS: what decides the selection or the run; a pull request that touches one runs the whole list
          if printf '%s\n' "$changed" | grep -Eq '^[.]github/workflows/|(^|/)python39_tests[.]txt$|(^|/)select_tests[.]py$|(^|/)(conftest[.]py|pytest[.]ini|pyproject[.]toml)$'; then
            echo "python39: this pull request changes what decides the selection; the whole list runs"
            grep -v -e '^#' -e '^[[:space:]]*$' scripts/python39_tests.txt | tee "$RUNNER_TEMP/py39.txt"
          else
            python3 scripts/select_tests.py --base "$BASE_SHA" --explain --within scripts/python39_tests.txt | tee "$RUNNER_TEMP/py39.txt"
          fi
          echo "python39: $(wc -l < "$RUNNER_TEMP/py39.txt") target(s)"
      - name: The whole python39 list
        if: >-
          github.event_name != 'pull_request' || github.base_ref == 'main'
          || contains(github.event.pull_request.labels.*.name, 'full-suite')
        shell: bash
        run: grep -v -e '^#' -e '^[[:space:]]*$' scripts/python39_tests.txt | tee "$RUNNER_TEMP/py39.txt"
      - name: The scripts the scheduler starts, on Python 3.9
        env:
          WB_SKIP_JS_ONLY_TESTS: "1"
        run: >-
          uv run --python 3.9 --with pytest==8.4.2 --with pytest-xdist==3.8.0 pytest -q -n auto -o faulthandler_timeout=120 --durations=20
          $(cat "$RUNNER_TEMP/py39.txt")

  container:
    name: container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: The eval container, built and exercised (no model call)
        run: WB_EVAL_DOCKER_TESTS=1 uv run --with pytest==9.1.1 pytest -q evals/tests/test_executor_docker.py evals/tests/test_keyproxy_docker.py

  # The document converter of the sources (providers/converter/): its image built from the pinned definition, and each format converted in a
  # real container with no network (poppler, pandoc from the dated Debian snapshot; openpyxl and python-pptx from the hash-checked lock); and the exporter's twin image (providers/exporter/),
  # each output format made in a real container, the formula guard read back from the real files. No model call.
  converter:
    name: converter
    needs: changes
    if: needs.changes.outputs.converter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: The converter image, built and exercised
        run: WB_CONVERTER_DOCKER_TESTS=1 uv run --with pytest==9.1.1 pytest -q providers/converter/tests/test_converter_docker.py providers/exporter/tests/test_exporter_docker.py

  # The WhatsApp program (providers/messenger/whatsapp/): vet and tests, offline once the modules are fetched. The runner's
  # own Go downloads the toolchain go.mod names (verified by the checksum database); modules are checked against go.sum.
  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go mod verify, go vet and go test, modules read-only
        working-directory: providers/messenger/whatsapp
        env:
          GOFLAGS: -mod=readonly
        run: go mod verify && go vet ./... && go test -count=1 ./...
