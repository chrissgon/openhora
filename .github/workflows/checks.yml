# The same checks as .githooks/pre-commit, for every push to main and every pull request.
# Actions are pinned to a commit (tags can move); Dependabot proposes updates.
#
# Which tests run (docs/decisions.md, 2026-10-20): ONE job, `tests`, which is the required check of the main ruleset, and so can never
# be skipped. DURING DEVELOPMENT, on a pull request into a branch other than main, it runs only the SELECTED tests
# (scripts/select_tests.py: the tests of what the pull request changed, plus a fixed set of guards). At the end of a large delivery
# it runs the WHOLE SUITE (with the full fuzz): on a push to main, on a pull request into main, on a manual run (workflow_dispatch, on
# any branch: the supervisor runs it on the integration branch at the end of a phase), and on a pull request that carries the label
# `full-suite` (adding the label starts the job, which is why `labeled` is a trigger). The steps carry the condition, never the job.
# The jobs that need docker or Go run when the paths they depend on changed, and always in those four cases.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A label added to a pull request starts a run of its own (below, every job but those of the whole suite is skipped on it), and must
# not cancel the run of the last push: so the two kinds of run are in two groups.
concurrency:
  group: checks-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate
    # Not on a label other than full-suite: nothing changed.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan reads every commit; the version rules read the pull request's base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Conventions and security scan
        run: python3 scripts/validate.py
        env:
          # The version rules read a change against the pull request's base, as the hook does with the merge
          # base of the default branch; on a push to main it is empty and the validator takes that merge base.
          WB_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Security scan, warnings included
        run: python3 scripts/security_scan.py --strict
      - name: Secrets in history
        run: python3 scripts/security_scan.py --history

  # One job, one required name. Two modes, chosen by the `if:` of its steps (never of the job, so that the check exists on every run):
  # the SELECTED tests of a pull request into a branch other than main (scripts/select_tests.py, rules at the top of the file: it
  # reads the files the pull request changed since its merge base with the base and prints the test files that can reach them, plus
  # the fixed guards; when it cannot compute the diff it selects every test folder), and the WHOLE SUITE (every test folder, and the
  # fuzz of the natural writes walked line by line: WB_FULL_FUZZ=1, about eight minutes of one process, runtime/README.md, "The
  # natural-writes fuzz") on a push to main, a pull request into main, a manual run and a pull request labelled full-suite. The whole
  # suite is the end of a large delivery: it catches what the selected tests cannot see (a dynamic import, a long call chain without
  # an import edge). The tests are split across the runner's processes (pytest-xdist, `-n auto`: one worker per vCPU, four on a public
  # repository's runner; the whole suite in one process took 18 to 19 minutes). --durations lists the slowest tests. The limit
  # leaves headroom for the full fuzz, a slow runner or a worker that waits on a timeout; the selected run is far shorter.
  tests:
    name: tests
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the selector reads the merge base with the pull request's base
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: Choose the tests this pull request can reach
        if: >-
          github.event_name == 'pull_request' && github.base_ref != 'main'
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/select_tests.py --base "$BASE_SHA" --explain | tee "$RUNNER_TEMP/selected-tests.txt"
      - name: Selected scanner, provider, runtime and script tests
        if: >-
          github.event_name == 'pull_request' && github.base_ref != 'main'
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        run: uv run --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n auto -o faulthandler_timeout=120 --durations=20 $(cat "$RUNNER_TEMP/selected-tests.txt")
      - name: Scanner and provider tests, the whole suite
        if: >-
          github.event_name != 'pull_request' || github.base_ref == 'main'
          || contains(github.event.pull_request.labels.*.name, 'full-suite')
        env:
          WB_FULL_FUZZ: "1"
        run: uv run --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n auto -o faulthandler_timeout=120 --durations=20 $(python3 scripts/test_dirs.py)

  # Which of the docker and Go jobs have anything to check: on a pull request into a branch other than main, those whose paths changed;
  # in the four cases of the whole suite, all of them. The paths are what each job's tests read: the eval container and its adapters,
  # the converter and exporter images and the workcopy scan, the WhatsApp program. This file counts for all three.
  changes:
    name: changes
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container: ${{ steps.paths.outputs.container }}
      converter: ${{ steps.paths.outputs.converter }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base of the pull request is read
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          set -eu
          everything=false
          if [ "$EVENT" != "pull_request" ] || [ "$ACTION" = "labeled" ] || [ "$BASE_REF" = "main" ] || [ "$FULL_LABEL" = "true" ]; then
            everything=true
          fi
          changed=""
          if [ "$everything" = "false" ]; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          fi
          touched() { [ "$everything" = "true" ] || printf '%s\n' "$changed" | grep -Eq "$1"; }
          container=false; converter=false; go=false
          touched '^(evals/|adapters/|shared/|scripts/stage_skills.py|runtime/workcopy.py|.github/workflows/checks.yml)' && container=true
          touched '^(providers/converter/|providers/exporter/|runtime/workcopy.py|providers/[^/]*[.]py|.github/workflows/checks.yml)' && converter=true
          touched '^(providers/messenger/whatsapp/|.github/workflows/checks.yml)' && go=true
          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "converter=$converter" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # The scheduler starts the runtime, and the runtime starts these scripts, with the system interpreter
  # (Python 3.9 on macOS): providers/CONTRACT.md, "Python version". Only their tests run here; the rest of
  # the suite needs a newer Python. pytest 9 needs Python 3.10, so this job pins the last release for 3.9.
  # shared/scripts/tests holds the tests of the scripts those skills carry as generated copies (the contrast
  # check among them, whose test moved there from skills/brand-identity/scripts/tests).
  # The tests are split across the runner's processes (pytest-xdist 3.8.0 supports Python 3.9; `-n auto`: one worker per
  # vCPU). Run in one process they took 12 to 15 minutes and ran into the old 15-minute limit; the limit now leaves
  # headroom for a slow runner. WB_SKIP_JS_ONLY_TESTS=1 leaves out the test_interface_*.py files that only drive Node
  # over JavaScript and CSS (runtime/tests/conftest.py says which): Python's version changes nothing for them, and the
  # tests job runs them. Every test of a Python module stays here.
  python39:
    name: python39
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.9"
      - name: The scripts the scheduler starts, on Python 3.9
        env:
          WB_SKIP_JS_ONLY_TESTS: "1"
        run: >-
          uv run --python 3.9 --with pytest==8.4.2 --with pytest-xdist==3.8.0 pytest -q -n auto -o faulthandler_timeout=120 --durations=20
          scripts/tests/test_runtime_python39.py scripts/tests/test_provider_resolve.py
          scripts/tests/test_runtime.py scripts/tests/test_runtime_vote.py scripts/tests/test_stage_skills.py
          skills/mkt-engage/scripts/tests skills/mkt-publish/scripts/tests
          skills/mkt-vote-round/scripts/tests skills/brand-identity/scripts/tests
          shared/scripts/tests
          runtime/tests
          providers/store/tests providers/scheduler/tests providers/mailer/tests providers/mailbox/tests providers/messenger/tests/test_whatsapp.py
          providers/messenger/tests/test_messenger_email.py
          providers/messenger/tests/test_forward_telegram.py providers/messenger/tests/test_forward_discord.py
          providers/messenger/tests/test_forward_whatsapp_cloud.py providers/messenger/tests/test_forward_twilio.py
          providers/messenger/tests/test_forward_email.py
          providers/messenger/tests/test_whatsapp_cloud.py providers/messenger/tests/test_whatsapp_cloud_webhook.py
          providers/messenger/tests/test_whatsapp_cloud_send.py providers/messenger/tests/test_whatsapp_cloud_render.py
          providers/messenger/tests/test_whatsapp_twilio.py providers/messenger/tests/test_whatsapp_twilio_webhook.py
          providers/messenger/tests/test_whatsapp_twilio_send.py providers/messenger/tests/test_whatsapp_twilio_render.py
          providers/model/tests

  container:
    name: container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: The eval container, built and exercised (no model call)
        run: WB_EVAL_DOCKER_TESTS=1 uv run --with pytest==9.1.1 pytest -q evals/tests/test_executor_docker.py evals/tests/test_keyproxy_docker.py

  # The document converter of the sources (providers/converter/): its image built from the pinned definition, and each format converted in a
  # real container with no network (poppler, pandoc from the dated Debian snapshot; openpyxl and python-pptx from the hash-checked lock); and the exporter's twin image (providers/exporter/),
  # each output format made in a real container, the formula guard read back from the real files. No model call.
  converter:
    name: converter
    needs: changes
    if: needs.changes.outputs.converter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.11"
      - name: The converter image, built and exercised
        run: WB_CONVERTER_DOCKER_TESTS=1 uv run --with pytest==9.1.1 pytest -q providers/converter/tests/test_converter_docker.py providers/exporter/tests/test_exporter_docker.py

  # The WhatsApp program (providers/messenger/whatsapp/): vet and tests, offline once the modules are fetched. The runner's
  # own Go downloads the toolchain go.mod names (verified by the checksum database); modules are checked against go.sum.
  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go mod verify, go vet and go test, modules read-only
        working-directory: providers/messenger/whatsapp
        env:
          GOFLAGS: -mod=readonly
        run: go mod verify && go vet ./... && go test -count=1 ./...
