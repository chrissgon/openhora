# Verifies the lock file of the published eval image whenever it changes: the shape, the owner of the repository, and the
# build provenance of every digest it names (python3 scripts/image_lock.py --check --verify-provenance). A lock that
# does not pass is not merged, so the setup step (python3 scripts/image_lock.py pull) and the executor can trust what
# the file on main names. On a pull request the check is run by the script of the pull request's BASE commit, read with
# git show and pointed at the pull request's checkout with --root, so that a change cannot weaken its own check; the
# checkout's own code is never run (the base has no copy yet only for the pull request that adds the script, which
# falls back to its own copy and says so). On a push to main the pushed commit's script runs. The job reads the
# repository and the public attestations and writes nothing: it has
# `contents: read` only and the run's read-only token, which gh uses to ask GitHub for the attestations.
# Actions are pinned to a commit (tags can move); Dependabot proposes updates.
name: image-lock

on:
  push:
    branches: [main]
    paths:
      - "evals/image-lock.json"
      - "scripts/image_lock.py"
      - ".github/workflows/image-lock.yml"
  pull_request:
    paths:
      - "evals/image-lock.json"
      - "scripts/image_lock.py"
      - ".github/workflows/image-lock.yml"

permissions:
  contents: read

concurrency:
  group: image-lock-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify the lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The lock, its owner and the provenance of every digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checker=scripts/image_lock.py
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git show "$BASE_SHA":scripts/image_lock.py > "$RUNNER_TEMP/image_lock.py" && grep -q -e '"--root"' "$RUNNER_TEMP/image_lock.py"; then
              checker="$RUNNER_TEMP/image_lock.py"
              echo "checking with the base commit's script"
            else
              echo "note: the base commit has no checker that reads another checkout yet; this pull request's own script runs"
            fi
          fi
          python3 "$checker" --check --verify-provenance --root "$GITHUB_WORKSPACE" --source-repo "$SOURCE_REPOSITORY"
