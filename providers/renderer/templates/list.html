<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="list">
<meta name="pv-params" content="items,icon,color">
<meta name="pv-looks" content="">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; width:950px; display:flex; justify-content:center; align-items:center; }
#card { display:flex; flex-direction:column; gap:22px; padding:44px 48px; border-radius:30px; border:6px solid var(--c-accent);
        background:var(--c-chip_fill); color:var(--c-text); box-shadow:0 14px 0 rgba(0,0,0,.35); width:880px; }
.row { display:flex; align-items:center; gap:28px; font-family:var(--font-display); font-weight:var(--weight-display); font-size:68px; line-height:1.08; letter-spacing:-0.02em; }
.dot { flex:none; width:84px; height:84px; border-radius:42px; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<script>
'use strict';
// A card is drawn inside the band the face box leaves above it (data.zones.card = [top, bottom]); it shrinks to fit that
// band, and the driver fails the render when a drawn card touches the face box. Pure function of (t, data).
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x) { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function clamp(x) { return Math.max(0, Math.min(1, x)); }
// Sets the card's transform: the shift and the motion scale of this frame, times the scale that makes it fit its band.
function place(card, data, shiftY, motion) {
  const z = data.zones.card;
  const pos = document.getElementById('pos');
  pos.style.top = z[0] + 'px';
  pos.style.height = (z[1] - z[0]) + 'px';
  card.dataset.zone = 'card';
  card.style.transform = 'none';
  const fit = Math.min(1, 0.82 * (z[1] - z[0]) / card.offsetHeight, 940 / card.offsetWidth);
  card.style.transform = 'translateY(' + Math.round(shiftY) + 'px) scale(' + (fit * motion).toFixed(4) + ')';
}
const ICONS = {
  'check': [['path', { d: 'M4 12.5l5 5L20 6.5', fill: 'none', 'stroke-width': 3 }]],
  'star': [['polygon', { points: '12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9', stroke: 'none' }]],
  'bolt': [['polygon', { points: '13,2 4,14 11,14 10,22 20,9 13,9', stroke: 'none' }]],
  'arrow-up': [['path', { d: 'M12 20V5M5 12l7-7 7 7', fill: 'none', 'stroke-width': 3 }]],
  'heart': [['path', { d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z', stroke: 'none' }]],
  'flag': [['path', { d: 'M5 21V4M5 4h12l-2 4 2 4H5', fill: 'none', 'stroke-width': 3 }]],
  'clock': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v5l3 2', fill: 'none', 'stroke-width': 3 }]],
  'coin': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v10M9.5 9.5c0-1.2 1.2-2 2.5-2s2.5.8 2.5 2-1.2 1.7-2.5 2-2.5.8-2.5 2 1.2 2 2.5 2 2.5-.8 2.5-2', fill: 'none', 'stroke-width': 2 }]]
};
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function icon(name, size, color) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.fill = color;
  svg.style.stroke = color;
  ICONS[name].forEach(function (part) {
    const el = document.createElementNS(NS, part[0]);
    Object.keys(part[1]).forEach(function (k) { el.setAttribute(k, part[1][k]); });
    svg.appendChild(el);
  });
  return svg;
}
window.renderAt = function (t, data) {
  const P = data.params;
  const card = document.getElementById('card');
  card.replaceChildren();
  const color = col(P.color || 'accent');
  card.style.borderColor = color;
  const tout = clamp((data.duration - t) / 0.3);
  const items = P.items.split(' | ');
  const step = Math.min(0.7, Math.max(0.3, (data.duration * 0.7) / items.length));
  items.forEach(function (text, k) {
    const p = easeOutBack(clamp((t - (0.3 + k * step)) / 0.35));      // staggered: each row pops in after the one before
    const row = document.createElement('div');
    row.className = 'row';
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = color;
    dot.appendChild(icon(P.icon || 'check', 48, 'var(--c-bg)'));
    const label = document.createElement('div');
    label.textContent = text;
    row.appendChild(dot);
    row.appendChild(label);
    row.style.opacity = clamp(p).toFixed(3);
    row.style.transform = 'translateX(' + Math.round((1 - p) * -60) + 'px)';
    card.appendChild(row);
  });
  place(card, data, (1 - easeOutCubic(clamp(t / 0.25))) * 24, 1);
  card.style.opacity = tout.toFixed(3);
};
</script>
</body>
</html>
