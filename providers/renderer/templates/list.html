<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="list">
<meta name="pv-params" content="items,icon,color">
<meta name="pv-looks" content="">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; width:950px; display:flex; justify-content:center; align-items:center; }
#card { display:flex; flex-direction:row; flex-wrap:nowrap; justify-content:center; align-items:center; gap:0.28em 0.3em; width:1000px; margin-left:-25px; }
.chip { display:flex; align-items:center; gap:0.2em; padding:0.14em 0.32em 0.16em 0.14em; border-radius:2em; border:0.06em solid var(--c-accent);
        background:var(--c-chip_fill); color:var(--c-text); font-family:var(--font-display); font-weight:var(--weight-display);
        line-height:1.05; letter-spacing:-0.02em; white-space:nowrap; box-shadow:0 0.1em 0 rgba(0,0,0,.35); transform-origin:50% 50%; }
.dot { flex:none; width:0.85em; height:0.85em; border-radius:50%; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<script>
'use strict';
// A card is drawn inside the band the face box leaves above it (data.zones.card = [top, bottom]): the largest type whose card fits the
// band's height and the frame's width, so a short band gives small type and never a card over the face. The card pops in (ease-out-back)
// and shrinks out. The driver measures every element marked data-zone and fails the render when one touches the face box.
// Pure function of (t, data): every style it relies on is set here, so a frame never depends on the one before.
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x, c1) { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInCubic(x) { return x * x * x; }
function clamp(x) { return Math.max(0, Math.min(1, x)); }
const FIT = 0.86;      // the share of the band a card fills at rest: the pop's overshoot (about 8 percent) then stays inside the band
function band(data) {
  const z = data.zones.card;
  const pos = document.getElementById('pos');
  pos.style.top = z[0] + 'px';
  pos.style.height = (z[1] - z[0]) + 'px';
  return z[1] - z[0];
}
const ICONS = {
  'check': [['path', { d: 'M4 12.5l5 5L20 6.5', fill: 'none', 'stroke-width': 3 }]],
  'star': [['polygon', { points: '12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9', stroke: 'none' }]],
  'bolt': [['polygon', { points: '13,2 4,14 11,14 10,22 20,9 13,9', stroke: 'none' }]],
  'arrow-up': [['path', { d: 'M12 20V5M5 12l7-7 7 7', fill: 'none', 'stroke-width': 3 }]],
  'heart': [['path', { d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z', stroke: 'none' }]],
  'flag': [['path', { d: 'M5 21V4M5 4h12l-2 4 2 4H5', fill: 'none', 'stroke-width': 3 }]],
  'clock': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v5l3 2', fill: 'none', 'stroke-width': 3 }]],
  'coin': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v10M9.5 9.5c0-1.2 1.2-2 2.5-2s2.5.8 2.5 2-1.2 1.7-2.5 2-2.5.8-2.5 2 1.2 2 2.5 2 2.5-.8 2.5-2', fill: 'none', 'stroke-width': 2 }]]
};
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function icon(name, size, color) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.fill = color;
  svg.style.stroke = color;
  ICONS[name].forEach(function (part) {
    const el = document.createElementNS(NS, part[0]);
    Object.keys(part[1]).forEach(function (k) { el.setAttribute(k, part[1][k]); });
    svg.appendChild(el);
  });
  return svg;
}
window.renderAt = function (t, data) {
  const P = data.params;
  const bandH = band(data);
  const row = document.getElementById('card');
  row.replaceChildren();
  const color = col(P.color || 'accent');
  const chips = P.items.split(' | ').map(function (text) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.zone = 'card';
    chip.style.borderColor = color;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = color;
    dot.appendChild(icon(P.icon || 'check', '0.5em', 'var(--c-bg)'));
    const label = document.createElement('div');
    label.textContent = text;
    chip.appendChild(dot);
    chip.appendChild(label);
    row.appendChild(chip);
    return chip;
  });
  // the type: one row if it stays readable (44 px), else two rows
  chips.forEach(function (c) { c.style.transform = 'none'; });
  row.style.flexWrap = 'nowrap';
  row.style.width = '';
  let fs = Math.min(76, bandH * 0.4);
  row.style.fontSize = fs + 'px';
  while (row.offsetWidth > 980 && fs > 44) { fs = fs * 0.95; row.style.fontSize = fs.toFixed(1) + 'px'; }
  if (row.offsetWidth > 980 || row.offsetHeight > bandH * FIT) {
    row.style.flexWrap = 'wrap';
    row.style.width = '980px';
    fs = Math.min(fs, bandH * 0.3);
    row.style.fontSize = fs + 'px';
    while (row.offsetHeight > bandH * FIT && fs > 30) { fs = fs * 0.95; row.style.fontSize = fs.toFixed(1) + 'px'; }
  }
  const step = Math.min(0.5, Math.max(0.22, (data.duration * 0.45) / chips.length));    // staggered: each chip pops in after the one before
  const tout = clamp((data.duration - t) / 0.25);
  chips.forEach(function (chip, k) {
    const at = 0.1 + k * step;
    const grow = 0.4 + 0.6 * easeOutBack(clamp((t - at) / 0.36), 2.0);
    const shrink = 0.88 + 0.12 * (1 - easeInCubic(1 - tout));
    chip.style.transform = 'scale(' + (grow * shrink).toFixed(4) + ')';
    chip.style.opacity = Math.min(clamp((t - at) / 0.1), tout).toFixed(3);
  });
};
</script>
</body>
</html>
