<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="split">
<meta name="pv-params" content="asset,side,fit,label">
<meta name="pv-looks" content="">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#half { position:absolute; overflow:hidden; background:var(--c-bg); }
#half > img { position:absolute; left:0; top:0; width:100%; height:100%; }
#bar { position:absolute; left:0; width:1080px; background:var(--c-bg); display:none; }
#chip { position:absolute; box-sizing:border-box; padding:12px 24px; border-radius:16px; border:4px solid var(--c-chip_border); background:var(--c-chip_fill);
        color:var(--c-chip_text); font-family:var(--font-mono); font-weight:var(--weight-mono); font-size:34px; letter-spacing:0.03em; overflow-wrap:anywhere; }
</style>
</head>
<body>
<div id="half"></div>
<div id="bar"></div>
<script>
'use strict';
// The frame split in two: ffmpeg lays the speaker into one half (a crop of the picture centred on the face) and this page draws the other:
// the picture in its half (object-fit cover or contain, the theme's background behind it) and the label chip in that half's corner nearest
// the seam. The speaker's half stays transparent. For a left or right split the captions cross the middle of the frame, so the page draws an
// opaque bar of the theme's background across the caption band and no seam runs under a caption.
// data.geom = {side, asset: {x, y, w, h}, bar: [top, bottom] or null, label: {x, max_w, top, bottom}}. A hard cut: everything is there on
// the beat's first frame and its last.
window.renderAt = function (t, data) {
  const P = data.params;
  const g = data.geom;
  const half = document.getElementById('half');
  half.style.left = g.asset.x + 'px';
  half.style.top = g.asset.y + 'px';
  half.style.width = g.asset.w + 'px';
  half.style.height = g.asset.h + 'px';
  const img = window.__imgs[P.asset];          // decoded by the driver before frame 0
  img.style.objectFit = P.fit || 'cover';
  if (img.parentNode !== half) half.replaceChildren(img);
  window.__box = { x: g.asset.x, y: g.asset.y, w: g.asset.w, h: g.asset.h };
  const bar = document.getElementById('bar');
  if (g.bar) {
    bar.style.display = 'block';
    bar.style.top = g.bar[0] + 'px';
    bar.style.height = (g.bar[1] - g.bar[0]) + 'px';
  } else {
    bar.style.display = 'none';
  }
  const old = document.getElementById('chip');
  if (old) old.remove();
  if (P.label) {
    const chip = document.createElement('div');
    chip.id = 'chip';
    chip.textContent = P.label;
    chip.style.left = g.label.x + 'px';
    chip.style.maxWidth = g.label.max_w + 'px';
    if (g.label.top !== null) chip.style.top = g.label.top + 'px';
    else chip.style.bottom = g.label.bottom + 'px';
    document.body.appendChild(chip);
  }
};
</script>
</body>
</html>
