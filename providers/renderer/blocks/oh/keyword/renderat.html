<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="keyword">
<meta name="pv-params" content="text,icon,color">
<meta name="pv-looks" content="style,max_lines,width_share,line_height,last_line_scale,max_font_px,letter_spacing_em,shadow,font,font_weight,font_fallback,replaces_caption,lead_seconds,variant">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; width:950px; display:flex; justify-content:center; align-items:center; }
#card { display:flex; flex-direction:row; align-items:center; gap:0.3em; padding:0.22em 0.55em 0.26em; border-radius:0.36em; border:0.07em solid var(--c-accent);
        background:var(--c-chip_fill); font-family:var(--font-display); font-weight:var(--weight-display); color:var(--c-text);
        text-align:center; line-height:1.05; letter-spacing:-0.02em; white-space:nowrap; box-shadow:0 0.12em 0 rgba(0,0,0,.35); transform-origin:50% 50%; }
#hpos { position:absolute; left:0; width:1080px; display:none; justify-content:center; align-items:flex-start; }
#stack { display:flex; flex-direction:column; align-items:center; width:max-content; box-sizing:border-box; text-transform:uppercase; text-align:center; }
#stack > div { white-space:nowrap; }
#measure { position:absolute; left:0; top:0; visibility:hidden; white-space:nowrap; text-transform:uppercase; }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<div id="hpos"><div id="stack"></div></div>
<span id="measure"></span>
<script>
'use strict';
// A card is drawn inside the band the face box leaves above it (data.zones.card = [top, bottom]): the largest type whose card fits the
// band's height and the frame's width, so a short band gives small type and never a card over the face. The card pops in (ease-out-back)
// and shrinks out. The driver measures every element marked data-zone and fails the render when one touches the face box.
// Pure function of (t, data): every style it relies on is set here, so a frame never depends on the one before.
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x, c1) { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInCubic(x) { return x * x * x; }
function clamp(x) { return Math.max(0, Math.min(1, x)); }
const FIT = 0.86;      // the share of the band a card fills at rest: the pop's overshoot (about 8 percent) then stays inside the band
function band(data) {
  const z = data.zones.card;
  const pos = document.getElementById('pos');
  pos.style.top = z[0] + 'px';
  pos.style.height = (z[1] - z[0]) + 'px';
  return z[1] - z[0];
}
const ICONS = {
  'check': [['path', { d: 'M4 12.5l5 5L20 6.5', fill: 'none', 'stroke-width': 3 }]],
  'star': [['polygon', { points: '12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9', stroke: 'none' }]],
  'bolt': [['polygon', { points: '13,2 4,14 11,14 10,22 20,9 13,9', stroke: 'none' }]],
  'arrow-up': [['path', { d: 'M12 20V5M5 12l7-7 7 7', fill: 'none', 'stroke-width': 3 }]],
  'heart': [['path', { d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z', stroke: 'none' }]],
  'flag': [['path', { d: 'M5 21V4M5 4h12l-2 4 2 4H5', fill: 'none', 'stroke-width': 3 }]],
  'clock': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v5l3 2', fill: 'none', 'stroke-width': 3 }]],
  'coin': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v10M9.5 9.5c0-1.2 1.2-2 2.5-2s2.5.8 2.5 2-1.2 1.7-2.5 2-2.5.8-2.5 2 1.2 2 2.5 2 2.5-.8 2.5-2', fill: 'none', 'stroke-width': 2 }]]
};
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function icon(name, size, color) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.fill = color;
  svg.style.stroke = color;
  ICONS[name].forEach(function (part) {
    const el = document.createElementNS(NS, part[0]);
    Object.keys(part[1]).forEach(function (k) { el.setAttribute(k, part[1][k]); });
    svg.appendChild(el);
  });
  return svg;
}
// The headline looks (data.look.style "headline", V9g): the keyword's own words in large uppercase type, 2 to look.max_lines stacked lines (one
// for a single word), as wide as look.width_share of the frame allows, the last line look.last_line_scale times larger, in the accent colour
// (or params.color), no box, a soft dark shadow, at the top of the caption band under the face (data.zones.caption). The font is the look's
// own (--font-look-keyword, when look.font names one) or the theme's display font. It neither pops nor fades: on screen from the beat's
// first frame to its last. The words are split into lines by the partition that gives the largest type: every split of the words into n
// lines, for each n, measured at 100 px (widths scale with the size). The stack carries a margin above its first line and below its last
// (ACCENT_EM, DESCENT_EM of the size) for accents and descenders, inside its measured box (data-zone), so no glyph reaches the face or the
// caption line the driver checks.
const ACCENT_EM = 0.22, DESCENT_EM = 0.12;
function partitions(n, k) {
  // every way to cut n words into k non-empty consecutive lines, as arrays of line lengths (n <= 24 characters' worth of words: small)
  if (k === 1) return [[n]];
  const out = [];
  for (let first = 1; first <= n - k + 1; first++) partitions(n - first, k - 1).forEach(function (rest) { out.push([first].concat(rest)); });
  return out;
}
function headline(t, data) {
  const P = data.params, L = data.look;
  const z = data.zones.caption;
  document.getElementById('pos').style.display = 'none';
  const card = document.getElementById('card');
  delete card.dataset.zone;
  const hpos = document.getElementById('hpos');
  const stack = document.getElementById('stack');
  const measure = document.getElementById('measure');
  const family = L.font ? 'var(--font-look-keyword)' : 'var(--font-display)';
  const weight = L.font ? 'var(--weight-look-keyword)' : 'var(--weight-display)';
  const lh = Number(L.line_height), ls = Number(L.last_line_scale), maxW = Math.floor(1080 * Number(L.width_share)), bandH = z[1] - z[0];
  [stack, measure].forEach(function (el) {
    el.style.fontFamily = family;
    el.style.fontWeight = weight;
    el.style.letterSpacing = Number(L.letter_spacing_em) + 'em';
  });
  measure.style.fontSize = '100px';
  const words = String(P.text).trim().split(/\s+/);
  const width = function (text) { measure.textContent = text; return measure.getBoundingClientRect().width; };
  let best = null;
  const most = Math.min(Number(L.max_lines), words.length), least = Math.min(2, words.length);
  for (let k = least; k <= most; k++) {
    partitions(words.length, k).forEach(function (cut) {
      const lines = [];
      let i = 0;
      cut.forEach(function (len) { lines.push(words.slice(i, i + len).join(' ')); i += len; });
      const scale = k > 1 ? ls : 1;
      const wide = Math.max.apply(null, lines.map(function (line, j) { return width(line) * (j === k - 1 ? scale : 1); }));
      const tall = lh * (k - 1 + scale) + ACCENT_EM + DESCENT_EM * scale;
      const fs = Math.min(Number(L.max_font_px), maxW * 100 / wide, bandH / tall);
      if (best === null || fs > best.fs + 0.01) best = { fs: fs, lines: lines, scale: scale };
    });
  }
  hpos.style.display = 'flex';
  hpos.style.top = z[0] + 'px';
  hpos.style.height = bandH + 'px';
  stack.replaceChildren();
  stack.dataset.zone = 'caption';
  stack.style.color = col(P.color || 'accent');
  stack.style.textShadow = L.shadow;
  best.lines.forEach(function (text, j) {
    const line = document.createElement('div');
    line.textContent = text;
    line.style.lineHeight = String(lh);
    if (j === best.lines.length - 1 && best.scale !== 1) line.style.fontSize = best.scale + 'em';
    stack.appendChild(line);
  });
  let fs = Math.floor(best.fs);
  const fit = function () {
    stack.style.fontSize = fs + 'px';
    stack.style.paddingTop = (ACCENT_EM * fs).toFixed(1) + 'px';
    stack.style.paddingBottom = (DESCENT_EM * fs * best.scale).toFixed(1) + 'px';
  };
  fit();
  while ((stack.offsetWidth > maxW || stack.offsetHeight > bandH) && fs > 24) { fs -= 2; fit(); }
}
window.renderAt = function (t, data) {
  const P = data.params;
  if (data.look && data.look.style === 'headline') { headline(t, data); return; }
  document.getElementById('hpos').style.display = 'none';
  delete document.getElementById('stack').dataset.zone;
  document.getElementById('pos').style.display = '';
  const bandH = band(data);
  const card = document.getElementById('card');
  card.replaceChildren();
  card.dataset.zone = 'card';
  const color = col(P.color || 'accent');
  card.style.borderColor = color;
  card.style.transform = 'none';
  if (P.icon) card.appendChild(icon(P.icon, '0.9em', color));
  const label = document.createElement('div');
  label.textContent = P.text;
  card.appendChild(label);
  let fs = Math.min(140, bandH * 0.56);
  card.style.fontSize = fs + 'px';
  while ((card.offsetWidth > 930 || card.offsetHeight > bandH * FIT) && fs > 34) { fs = fs * 0.94; card.style.fontSize = fs.toFixed(1) + 'px'; }
  const tin = clamp(t / 0.38);
  const tout = clamp((data.duration - t) / 0.22);
  const grow = 0.5 + 0.5 * easeOutBack(tin, 2.0);
  const shrink = 0.86 + 0.14 * (1 - easeInCubic(1 - tout));
  card.style.transform = 'scale(' + (grow * shrink).toFixed(4) + ')';
  card.style.opacity = Math.min(clamp(t / 0.1), tout).toFixed(3);
};
</script>
</body>
</html>
