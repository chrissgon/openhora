<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="pip">
<meta name="pv-params" content="asset,position,label">
<meta name="pv-looks" content="radius_px,shadow">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#card { position:absolute; box-sizing:border-box; background:transparent; }
#chip { position:absolute; padding:12px 24px; border-radius:16px; border:4px solid var(--c-chip_border); background:var(--c-chip_fill);
        color:var(--c-chip_text); font-family:var(--font-mono); font-weight:var(--weight-mono); font-size:34px; letter-spacing:0.03em; white-space:nowrap; }
</style>
</head>
<body>
<div id="card" data-zone="card"></div>
<script>
'use strict';
// The speaker stays full frame and the asset is composed by ffmpeg into a rounded card over it; the page draws only the soft shadow outside the
// card's edges (the box itself stays transparent) and the label on its top-left corner. data.geom is the card's box {x, y, w, h}.
// A hard cut: everything is there on the beat's first frame and its last.
window.renderAt = function (t, data) {
  const P = data.params;
  const L = data.look;
  const g = data.geom;
  const card = document.getElementById('card');
  card.style.left = g.x + 'px';
  card.style.top = g.y + 'px';
  card.style.width = g.w + 'px';
  card.style.height = g.h + 'px';
  card.style.borderRadius = L.radius_px + 'px';
  card.style.boxShadow = L.shadow;
  const old = document.getElementById('chip');
  if (old) old.remove();
  if (P.label) {
    const chip = document.createElement('div');
    chip.id = 'chip';
    chip.textContent = P.label;
    chip.style.left = Math.max(65, g.x) + 'px';
    chip.style.top = (g.y - 8) + 'px';
    document.body.appendChild(chip);
  }
};
</script>
</body>
</html>
