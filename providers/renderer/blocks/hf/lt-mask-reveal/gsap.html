<!-- hf:lt-mask-reveal: a lower third in which an accent bar sweeps across and a clip-path wipe reveals a heavy name, then a role line fades up. Adapted from the HyperFrames registry component lt-mask-reveal (file lt-mask-reveal.html, sha256 7f348ec3124e211f7ec8e7241f21220134504ab713143e3f9dc10e016892e2e3), commit b4cc674f7f312e77ded32e0b53006cc0bad6723b, Apache-2.0; changes: rewritten as one fragment of our own contract, the name and the role read from the payload, sizes by arithmetic from the band and the text length, theme tokens and allow-listed fonts, bar travel by percent of the name's own box, a role line from the quote preset's author, the role line at half the name's size and never under 36 px; notices in providers/renderer/hf-runtime/NOTICE.md -->
<template data-hf-block="hf:lt-mask-reveal">
  <style>
    .stage, .stage *, .stage *::before, .stage *::after { box-sizing: border-box; }
    .stage { position: absolute; inset: 0; pointer-events: none; }
    .lt { position: absolute; left: 70px; bottom: 30px; display: flex; flex-direction: column; align-items: flex-start; gap: 0.2em; }
    .namewrap { position: relative; overflow: hidden; padding: 2px 0; }
    .name { font-family: var(--font-display); font-weight: var(--weight-display); color: var(--c-text); line-height: 0.98; letter-spacing: -0.02em; white-space: nowrap;
            text-shadow: 0 2px 22px rgba(0, 0, 0, 0.45); }
    .sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 8px; background: var(--c-accent); }
    .role { font-family: var(--font-text); font-weight: var(--weight-text); color: var(--c-muted); line-height: 1.2; letter-spacing: 0.02em; white-space: nowrap;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }
  </style>
  <div class="stage"><div class="lt"><div class="namewrap"><div class="name"></div><div class="sweep"></div></div><div class="role"></div></div></div>
  <script data-hf-build>
    function build(root, tl, data, ctx) {
      var EM_CHAR = 0.62, WIDTH = 940, FS_MAX = 92, FS_MIN = 40, ROLE_RATIO = 0.5, ROLE_MIN = 36;
      var P = data.params;
      var lt = root.querySelector(".lt");
      var nameEl = root.querySelector(".name");
      var sweep = root.querySelector(".sweep");
      var role = root.querySelector(".role");
      var wrap = root.querySelector(".namewrap");
      var color = P.color ? (P.color.charAt(0) === "#" ? P.color : "var(--c-" + P.color + ")") : "var(--c-accent)";
      sweep.style.background = color;
      nameEl.textContent = P.text;
      var size = Math.max(FS_MIN, Math.min(FS_MAX, WIDTH / (EM_CHAR * P.text.length)));
      lt.style.fontSize = size.toFixed(1) + "px";
      nameEl.style.fontSize = "1em";
      role.style.fontSize = Math.max(ROLE_MIN, size * ROLE_RATIO).toFixed(1) + "px";
      if (P.author) { role.textContent = P.author; } else { role.remove(); }
      var d = ctx.duration;
      var outAt = Math.max(1.3, d - 0.55);
      tl.set(nameEl, { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.set(sweep, { left: "0%", opacity: 0 }, 0);
      tl.to(sweep, { opacity: 1, duration: 0.12, ease: "none" }, 0.1);
      tl.to(sweep, { left: "100%", duration: 0.55, ease: "power2.inOut" }, 0.12);
      tl.to(nameEl, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 0.16);
      tl.to(sweep, { opacity: 0, duration: 0.15, ease: "none" }, 0.6);
      if (P.author) {
        tl.fromTo(role, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);
        tl.to(role, { opacity: 0, duration: 0.3, ease: "power2.in" }, outAt - 0.05);
      }
      tl.to(nameEl, { clipPath: "inset(0 0 0 100%)", duration: 0.4, ease: "power2.in" }, outAt);
    }
  </script>
</template>
