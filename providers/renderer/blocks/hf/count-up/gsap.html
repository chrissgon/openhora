<!-- hf:count-up: one figure counts up to its value and lands with a small pulse, a label under it. Adapted from the HyperFrames registry component count-up (file count-up.html, sha256 6b34b9873a243fedb060d23f4eb5cef1b61a5b169ec1ae064030b70b48beea66), commit b4cc674f7f312e77ded32e0b53006cc0bad6723b, Apache-2.0; changes: rewritten as one fragment of our own contract, the figure is the written value (separators kept, the last frame is the value exactly) counted from zero, a label and a colour parameter, sizes by arithmetic from the band and the text length, pixel units instead of container units, theme tokens for the colours and the allow-listed font, no sample values. See providers/renderer/hyperframes-image/NOTICE.md. -->
<template data-hf-block="hf:count-up">
  <style>
    .stage, .stage *, .stage *::before, .stage *::after { box-sizing: border-box; }
    .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .group { display: flex; flex-direction: column; align-items: center; max-width: 930px; text-align: center; color: var(--c-text);
             text-shadow: 0 0.04em 0.18em rgba(0, 0, 0, 0.6); transform-origin: 50% 58%; }
    .figure { font-family: var(--font-display); font-weight: var(--weight-display); line-height: 1; letter-spacing: -0.04em; white-space: nowrap;
              font-variant-numeric: tabular-nums; }
    .label { font-family: var(--font-text); font-weight: var(--weight-text); line-height: 1.2; }
  </style>
  <div class="stage"><div class="group"><div class="figure"><span class="val"></span></div><div class="label"></div></div></div>
  <script data-hf-build>
    function build(root, tl, data, ctx) {
      var FIT = 0.86, FS_MAX = 150, FS_MIN = 30, EM_DIGIT = 0.66, WIDTH = 930, GAP = 0.12, LABEL_EM = 0.3, LABEL_CHAR = 0.58, COUNT_BASE = 1.72, IN_BASE = 2.05;
      function parseFigure(s) {
        var m = /^(\d[\d.,]*)([.,])(\d{1,2})$/.exec(s);
        var dec = m ? m[2] : "";
        var whole = m ? m[1] : s;
        var thousands = (whole.match(/[.,]/) || [""])[0];
        var digits = whole.replace(/[.,]/g, "");
        return { target: Number(digits + (m ? "." + m[3] : "")), decimals: m ? m[3].length : 0, dec: dec, thousands: thousands };
      }
      function formatFigure(v, f) {
        var parts = v.toFixed(f.decimals).split(".");
        var grouped = f.thousands ? parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, f.thousands) : parts[0];
        return grouped + (parts[1] ? f.dec + parts[1] : "");
      }
      var P = data.params;
      var group = root.querySelector(".group");
      var figure = root.querySelector(".figure");
      var val = root.querySelector(".val");
      var label = root.querySelector(".label");
      var color = P.color ? (P.color.charAt(0) === "#" ? P.color : "var(--c-" + P.color + ")") : "var(--c-accent)";
      figure.style.color = color;
      var f = parseFigure(P.value);
      var labelText = P.label || "";
      label.textContent = labelText;
      function stackHeight(size) {
        var labelSize = Math.max(18, size * LABEL_EM);
        var labelLines = labelText ? Math.max(1, Math.ceil(labelText.length * LABEL_CHAR * labelSize / WIDTH)) : 0;
        return size * 1.0 + (labelText ? size * GAP + labelLines * labelSize * 1.2 : 0);
      }
      var size = Math.min(FS_MAX, WIDTH / (EM_DIGIT * P.value.length));
      while (stackHeight(size) > ctx.band.height * FIT && size > FS_MIN) { size = size * 0.94; }
      figure.style.fontSize = size.toFixed(1) + "px";
      label.style.fontSize = Math.max(18, size * LABEL_EM).toFixed(1) + "px";
      label.style.marginTop = (size * GAP).toFixed(1) + "px";
      label.style.maxWidth = WIDTH + "px";
      var scale = ctx.duration < IN_BASE ? ctx.duration / IN_BASE : 1;
      var count = COUNT_BASE * scale;
      var arrive = Math.min(0.38 * scale, ctx.duration / 4);
      var pulse = 0.165 * scale;
      var last = Math.max(1, Math.round(count * ctx.fps));
      val.textContent = formatFigure(0, f);
      tl.fromTo(group, { opacity: 0, y: ctx.band.height * 0.022, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: arrive, ease: "power3.out" }, 0);
      for (var i = 1; i <= last; i += 1) {
        var progress = i / last;
        var eased = 0.5 - 0.5 * Math.cos(Math.PI * progress);
        tl.set(val, { textContent: i === last ? P.value : formatFigure(f.target * eased, f) }, count * progress);
      }
      tl.fromTo(group, { scale: 1 }, { immediateRender: false, scale: 1.07, duration: pulse, ease: "power3.out" }, count);
      tl.fromTo(group, { scale: 1.07 }, { immediateRender: false, scale: 1, duration: pulse, ease: "power2.out" }, count + pulse);
      var out = Math.min(0.2, ctx.duration / 5);
      tl.fromTo(group, { opacity: 1 }, { immediateRender: false, opacity: 0, duration: out, ease: "power2.in" }, Math.max(count + 2 * pulse, ctx.duration - out));
    }
  </script>
</template>
