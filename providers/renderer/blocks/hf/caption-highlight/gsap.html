<!-- hf:caption-highlight: the spoken words under the face, a colour sweep behind the word being said. Adapted from the HyperFrames registry component caption-highlight (file caption-highlight.html, sha256 769a0c2012088525b75401079bfae45e774fa39decdc37194d7f7e607c5c908e), commit b4cc674f7f312e77ded32e0b53006cc0bad6723b, Apache-2.0; changes: rewritten as one fragment of our own contract, words and times read from the payload, bottom-anchored in the caption band with the type sized by arithmetic so the lowest glyph stays above the band bottom, theme tokens for the colours and the two allow-listed fonts, no measuring canvas, no sample text. See providers/renderer/hyperframes-image/NOTICE.md. -->
<template data-hf-block="hf:caption-highlight">
  <style>
    .stage, .stage *, .stage *::before, .stage *::after { box-sizing: border-box; }
    .stage { position: absolute; inset: 0 0 44px 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 60px; pointer-events: none; }
    .line { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; max-width: 960px; gap: 0 0.12em;
            font-family: var(--font-display); font-weight: var(--weight-display); line-height: 1.25; letter-spacing: 0.02em; text-transform: uppercase; color: var(--c-text); }
    .word { position: relative; z-index: 0; display: inline-block; padding: 0.06em 0.16em 0.08em; text-shadow: 0 0.06em 0.22em rgba(0, 0, 0, 0.55); }
    .bg { position: absolute; inset: 0; z-index: -1; border-radius: 0.14em; background: var(--c-accent); opacity: 0; transform: scaleX(0); transform-origin: 0% 50%; }
    .txt { position: relative; }
  </style>
  <div class="stage"><div class="line"><span class="word"><span class="bg"></span><span class="txt"></span></span></div></div>
  <script data-hf-build>
    function build(root, tl, data, ctx) {
      var FS_MAX = 88, FS_MIN = 40, LINE_BLOCK = 1.39, EM_CHAR = 0.74, EM_PAD = 0.32, EM_GAP = 0.12, WIDTH = 960, PAD_BOTTOM = 44;
      var stage = root.querySelector(".stage");
      var line = root.querySelector(".line");
      var proto = root.querySelector(".word");
      var made = proto.cloneNode(true);
      proto.remove();
      var words = data.words;
      var chars = 0, longest = 0;
      words.forEach(function (w) { chars += w.text.length; longest = Math.max(longest, w.text.length); });
      var oneLine = EM_CHAR * chars + EM_PAD * words.length + EM_GAP * Math.max(0, words.length - 1);
      var lines = 1;
      var fs = Math.min(FS_MAX, WIDTH / oneLine);
      if (fs < FS_MIN) {
        lines = 2;
        fs = Math.min(FS_MAX, WIDTH / (oneLine / 2 + EM_CHAR * longest + EM_PAD));
      }
      while (lines * fs * LINE_BLOCK + PAD_BOTTOM > ctx.band.height && fs > 12) { fs = fs * 0.94; }
      line.style.fontSize = fs.toFixed(1) + "px";
      stage.style.justifyContent = data.anchor === "center" ? "center" : "flex-end";
      var fade = Math.min(0.12, ctx.duration / 4);
      tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: fade, ease: "power2.out" }, 0);
      tl.fromTo(line, { opacity: 1 }, { immediateRender: false, opacity: 0, duration: fade, ease: "power2.in" }, Math.max(0, ctx.duration - fade));
      words.forEach(function (w) {
        var el = made.cloneNode(true);
        var bg = el.querySelector(".bg");
        var txt = el.querySelector(".txt");
        txt.textContent = w.text;
        line.appendChild(el);
        var begin = Math.max(0, w.start);
        var finish = Math.max(begin + 0.1, w.end);
        tl.fromTo(bg, { opacity: 0, scaleX: 0 }, { immediateRender: false, opacity: 1, scaleX: 1, duration: 0.15, ease: "power2.out" }, begin);
        tl.set(txt, { color: "var(--c-bg)" }, begin);
        tl.fromTo(bg, { opacity: 1, scaleX: 1 }, { immediateRender: false, opacity: 0, scaleX: 1.02, duration: 0.1, ease: "power2.in" }, finish);
        tl.set(bg, { scaleX: 0 }, finish + 0.1);
        tl.set(txt, { color: "var(--c-text)" }, finish);
      });
    }
  </script>
</template>
