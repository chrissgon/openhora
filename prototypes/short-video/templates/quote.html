<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="quote">
<meta name="pv-params" content="text,author,color">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; top:440px; width:950px; }
#card { display:flex; flex-direction:column; gap:14px; padding:24px 56px 48px; border-radius:30px; border:6px solid var(--c-accent);
        background:var(--c-chip_fill); color:var(--c-text); box-shadow:0 14px 0 rgba(0,0,0,.35); }
#mark { font-family:var(--font-display); font-weight:var(--weight-display); font-size:260px; line-height:0.8; height:130px; color:var(--c-accent); }
#q { font-family:var(--font-display); font-weight:var(--weight-display); line-height:1.12; letter-spacing:-0.02em; }
#by { font-family:var(--font-mono); font-weight:var(--weight-mono); font-size:36px; letter-spacing:0.03em; color:var(--c-chip_text); margin-top:10px; }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<script>
'use strict';
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function clamp(x) { return Math.max(0, Math.min(1, x)); }

window.renderAt = function (t, data) {
  const P = data.params;
  const card = document.getElementById('card');
  card.replaceChildren();
  const color = col(P.color);
  card.style.borderColor = color;
  const mark = document.createElement('div');
  mark.id = 'mark';
  mark.textContent = '“';
  mark.style.color = color;
  card.appendChild(mark);
  const q = document.createElement('div');
  q.id = 'q';
  q.textContent = P.text;
  const n = P.text.length;
  q.style.fontSize = (n <= 40 ? 88 : n <= 80 ? 70 : 58) + 'px';
  card.appendChild(q);
  if (P.author) {
    const by = document.createElement('div');
    by.id = 'by';
    by.textContent = '— ' + P.author;
    by.style.opacity = easeOutCubic(clamp((t - 0.5) / 0.3)).toFixed(3);
    card.appendChild(by);
  }
  const tin = easeOutCubic(clamp(t / 0.4));
  const tout = clamp((data.duration - t) / 0.3);
  card.style.opacity = Math.min(tin, tout).toFixed(3);
  card.style.transform = 'translateY(' + Math.round((1 - tin) * 50) + 'px)';
};
</script>
</body>
</html>
