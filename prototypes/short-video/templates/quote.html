<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="quote">
<meta name="pv-params" content="text,author,color">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; width:950px; display:flex; justify-content:center; align-items:center; }
#card { display:flex; flex-direction:row; align-items:center; gap:0.3em; padding:0.2em 0.5em 0.24em 0.3em; border-radius:0.3em; border:0.06em solid var(--c-accent);
        background:var(--c-chip_fill); color:var(--c-text); box-shadow:0 0.1em 0 rgba(0,0,0,.35); max-width:930px; transform-origin:50% 50%; }
#body { display:flex; flex-direction:column; gap:0.12em; }
#mark { font-family:var(--font-display); font-weight:var(--weight-display); font-size:2.2em; line-height:0.8; align-self:flex-start; color:var(--c-accent); }
#q { font-family:var(--font-display); font-weight:var(--weight-display); line-height:1.12; letter-spacing:-0.02em; }
#by { font-family:var(--font-mono); font-weight:var(--weight-mono); font-size:0.42em; letter-spacing:0.03em; color:var(--c-chip_text); }
</style>
</head>
<body>
<div id="pos"><div id="card" data-zone="overlay"></div></div>
<script>
'use strict';
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x) { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInCubic(x) { return x * x * x; }
function clamp(x) { return Math.max(0, Math.min(1, x)); }

window.renderAt = function (t, data) {
  const P = data.params;
  const z = data.zone || { top: 285, bottom: 700 };
  const bandH = z.bottom - z.top;
  const pos = document.getElementById('pos');
  pos.style.top = z.top + 'px';
  pos.style.height = bandH + 'px';
  const card = document.getElementById('card');
  card.replaceChildren();
  card.style.transform = 'none';
  const color = col(P.color);
  card.style.borderColor = color;
  const mark = document.createElement('div');
  mark.id = 'mark';
  mark.textContent = '\u201C';
  mark.style.color = color;
  card.appendChild(mark);
  const body = document.createElement('div');
  body.id = 'body';
  const q = document.createElement('div');
  q.id = 'q';
  q.textContent = P.text;
  body.appendChild(q);
  if (P.author) {
    const by = document.createElement('div');
    by.id = 'by';
    by.textContent = '\u2014 ' + P.author;
    by.style.opacity = easeOutCubic(clamp((t - 0.5) / 0.3)).toFixed(3);
    body.appendChild(by);
  }
  card.appendChild(body);
  // the largest type that fits the band (a long quote is small: the band above a face is short)
  let fs = Math.min(70, bandH * 0.4);
  card.style.fontSize = fs + 'px';
  while (card.offsetHeight > bandH * 0.96 && fs > 18) { fs = fs * 0.95; card.style.fontSize = fs.toFixed(1) + 'px'; }
  const tout = clamp((data.duration - t) / 0.3);
  const shrink = 0.9 + 0.1 * (1 - easeInCubic(1 - tout));
  card.style.opacity = Math.min(clamp(t / 0.15), tout).toFixed(3);
  card.style.transform = 'scale(' + ((0.6 + 0.4 * easeOutBack(clamp(t / 0.4))) * shrink).toFixed(4) + ')';
};
</script>
</body>
</html>
