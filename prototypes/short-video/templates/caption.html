<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="caption">
<meta name="pv-params" content="position">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#stage { position:absolute; left:30px; width:1020px; display:flex; justify-content:center; align-items:flex-start; padding-top:14px; box-sizing:border-box; }
#line { display:flex; flex-wrap:nowrap; justify-content:center; align-items:center; gap:0 0.4em; white-space:nowrap;
        font-family:var(--font-display); font-weight:var(--weight-display); line-height:1.1; letter-spacing:-0.01em;
        text-align:center; color:var(--c-text); transform-origin:50% 50%; }
.w { display:inline-block; transform-origin:50% 60%;
     -webkit-text-stroke:0.14em rgba(0,0,0,.92); paint-order:stroke fill; stroke-linejoin:round;
     text-shadow:0 0.05em 0.22em rgba(0,0,0,.65), 0 0.08em 0 rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="stage"><div id="line"></div></div>
<script>
'use strict';
// Pure function of (t, data). t is seconds since this chunk started; data.words times are relative to it;
// data.zone is the band the captions live in ({top, bottom}, px): below the speaker's face, never over it.
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function easeOutBack(x, c1) { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

window.renderAt = function (t, data) {
  const stage = document.getElementById('stage');
  const line = document.getElementById('line');
  const z = data.zone || { top: 1000, bottom: 1248 };
  stage.style.top = z.top + 'px';
  stage.style.height = (z.bottom - z.top) + 'px';
  line.replaceChildren();
  let active = -1;
  data.words.forEach(function (w, i) { if (w.start <= t) active = i; });
  data.words.forEach(function (w, i) {
    const s = document.createElement('span');
    s.className = 'w';
    s.setAttribute('data-zone', 'caption');
    s.textContent = w.text;
    if (i === active) {
      s.style.color = 'var(--c-accent)';
      const pop = easeOutBack(clamp((t - w.start) / 0.18), 2.2);   // scale-up on the word being said
      s.style.transform = 'scale(' + (1 + 0.12 * pop).toFixed(4) + ')';
    }
    line.appendChild(s);
  });
  // one line, as big as fits the width
  line.style.transform = 'none';
  let fs = Math.min(132, (z.bottom - z.top) * 0.62);
  line.style.fontSize = fs + 'px';
  while (line.offsetWidth > 960 && fs > 60) { fs = fs * 0.94; line.style.fontSize = fs.toFixed(1) + 'px'; }
  // the chunk pops in
  const pin = easeOutBack(clamp(t / 0.14), 1.7);
  line.style.transform = 'scale(' + (0.88 + 0.12 * pin).toFixed(4) + ')';
  line.style.opacity = clamp(t / 0.06).toFixed(3);
};
</script>
</body>
</html>
