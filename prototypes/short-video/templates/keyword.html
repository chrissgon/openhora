<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="keyword">
<meta name="pv-params" content="text,icon,color,position">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; width:950px; height:0; display:flex; justify-content:center; align-items:center; }
#card { display:flex; flex-direction:column; align-items:center; gap:18px; padding:34px 60px 40px; border-radius:30px; border:6px solid var(--c-accent);
        background:var(--c-chip_fill); font-family:var(--font-display); font-weight:var(--weight-display); color:var(--c-text);
        text-align:center; line-height:1.05; letter-spacing:-0.02em; box-shadow:0 14px 0 rgba(0,0,0,.35); }
#bar { height:10px; border-radius:5px; background:var(--c-accent); }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<script>
'use strict';
const ICONS = {
  'check': [['path', { d: 'M4 12.5l5 5L20 6.5', fill: 'none', 'stroke-width': 3 }]],
  'star': [['polygon', { points: '12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,18 5.5,22 7.5,14.5 2,9.5 9,9', stroke: 'none' }]],
  'bolt': [['polygon', { points: '13,2 4,14 11,14 10,22 20,9 13,9', stroke: 'none' }]],
  'arrow-up': [['path', { d: 'M12 20V5M5 12l7-7 7 7', fill: 'none', 'stroke-width': 3 }]],
  'heart': [['path', { d: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z', stroke: 'none' }]],
  'flag': [['path', { d: 'M5 21V4M5 4h12l-2 4 2 4H5', fill: 'none', 'stroke-width': 3 }]],
  'clock': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v5l3 2', fill: 'none', 'stroke-width': 3 }]],
  'coin': [['circle', { cx: 12, cy: 12, r: 9, fill: 'none', 'stroke-width': 3 }], ['path', { d: 'M12 7v10M9.5 9.5c0-1.2 1.2-2 2.5-2s2.5.8 2.5 2-1.2 1.7-2.5 2-2.5.8-2.5 2 1.2 2 2.5 2 2.5-.8 2.5-2', fill: 'none', 'stroke-width': 2 }]]
};
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function icon(name, size, color) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.fill = color;
  svg.style.stroke = color;
  ICONS[name].forEach(function (part) {
    const el = document.createElementNS(NS, part[0]);
    Object.keys(part[1]).forEach(function (k) { el.setAttribute(k, part[1][k]); });
    svg.appendChild(el);
  });
  return svg;
}
function easeOutBack(x) { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function clamp(x) { return Math.max(0, Math.min(1, x)); }

window.renderAt = function (t, data) {
  const P = data.params;
  const pos = document.getElementById('pos');
  const card = document.getElementById('card');
  const y = { top: 440, center: 700, bottom: 1000 }[P.position];
  pos.style.top = y + 'px';
  card.replaceChildren();
  const color = col(P.color);
  card.style.borderColor = color;
  if (P.icon) card.appendChild(icon(P.icon, 96, color));
  const label = document.createElement('div');
  label.textContent = P.text;
  const n = P.text.length;
  label.style.fontSize = (n <= 8 ? 150 : n <= 14 ? 118 : 88) + 'px';
  card.appendChild(label);
  const bar = document.createElement('div');
  bar.id = 'bar';
  bar.style.background = color;
  bar.style.width = Math.round(220 * clamp((t - 0.12) / 0.3)) + 'px';
  card.appendChild(bar);
  const tin = clamp(t / 0.3);
  const tout = clamp((data.duration - t) / 0.2);
  const s = (0.45 + 0.55 * easeOutBack(tin)) * (0.92 + 0.08 * tout);
  card.style.transform = 'scale(' + s.toFixed(4) + ')';
  card.style.opacity = String(Math.min(clamp(t / 0.12), tout).toFixed(3));
};
</script>
</body>
</html>
