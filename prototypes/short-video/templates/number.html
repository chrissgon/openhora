<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="pv-preset" content="number">
<meta name="pv-params" content="value,prefix,suffix,label,color">
<style>
:root { --c-bg:#0B0F14; --c-text:#FFFFFF; --c-muted:#A8B0BC; --c-accent:#FFC93C; --c-chip_fill:#1B1F2A; --c-chip_text:#FFE08A; --c-chip_border:#FFC93C;
        --font-display:system-ui,sans-serif; --font-text:system-ui,sans-serif; --font-mono:ui-monospace,monospace;
        --weight-display:800; --weight-text:500; --weight-mono:500; }
html, body { margin:0; padding:0; background:transparent; width:1080px; height:1920px; overflow:hidden; }
#pos { position:absolute; left:65px; top:520px; width:950px; }
#card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:50px 40px 46px; border-radius:30px; border:6px solid var(--c-accent);
        background:var(--c-chip_fill); color:var(--c-text); box-shadow:0 14px 0 rgba(0,0,0,.35); text-align:center; }
#fig { font-family:var(--font-display); font-weight:var(--weight-display); letter-spacing:-0.03em; line-height:1; white-space:nowrap; }
#lab { font-family:var(--font-text); font-weight:var(--weight-text); font-size:52px; line-height:1.15; color:var(--c-muted); }
</style>
</head>
<body>
<div id="pos"><div id="card"></div></div>
<script>
'use strict';
function col(v) { return v.charAt(0) === '#' ? v : 'var(--c-' + v + ')'; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x) { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function group(intStr) { return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

window.renderAt = function (t, data) {
  const P = data.params;
  const card = document.getElementById('card');
  card.replaceChildren();
  const color = col(P.color);
  card.style.borderColor = color;
  const countFor = Math.min(1.4, data.duration * 0.6);
  const v = P.value * easeOutCubic(clamp((t - 0.1) / countFor));
  const decimals = (String(P.value).split('.')[1] || '').length;
  const parts = v.toFixed(decimals).split('.');
  const text = (P.prefix || '') + group(parts[0]) + (parts[1] ? '.' + parts[1] : '') + (P.suffix || '');
  const fig = document.createElement('div');
  fig.id = 'fig';
  fig.textContent = text;
  fig.style.fontSize = (text.length <= 5 ? 250 : text.length <= 8 ? 190 : 140) + 'px';
  fig.style.color = color;
  card.appendChild(fig);
  if (P.label) {
    const lab = document.createElement('div');
    lab.id = 'lab';
    lab.textContent = P.label;
    card.appendChild(lab);
  }
  const tout = clamp((data.duration - t) / 0.3);
  card.style.opacity = Math.min(clamp(t / 0.15), tout).toFixed(3);
  card.style.transform = 'scale(' + (0.7 + 0.3 * easeOutBack(clamp(t / 0.35))).toFixed(4) + ')';
};
</script>
</body>
</html>
