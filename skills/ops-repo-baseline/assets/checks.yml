# The project's own fast checks and a secret scan, on every push to <default-branch> and every pull request.
# Actions are pinned to a commit (a tag can be moved); Dependabot proposes updates. Read-only permissions.
# Fill every <...> from the project's AGENTS.md (or its manifest scripts); delete a step the project lacks.
name: checks

on:
  push:
    branches: [<default-branch>]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/<default-branch>' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<commit sha> # <tag>
        with:
          fetch-depth: 0 # the history scan reads every commit
          persist-credentials: false
      - name: Secrets in the working tree
        run: python3 scripts/secret-scan/secret_scan.py
      - name: Secrets in history
        run: python3 scripts/secret-scan/secret_scan.py --history
      # Optional second scanner. Keep the next two steps only when the user chose "bundled + gitleaks"; delete them
      # otherwise. Never replace the two steps above. The version and the checksum are the pin of
      # references/gitleaks.md (linux x64, the runner's architecture); no GitHub Action is used for it.
      - name: Install gitleaks (pinned, checksum checked)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Secrets in history (gitleaks)
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 --config scripts/secret-scan/gitleaks.toml .'

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@<commit sha> # <tag>
        with:
          persist-credentials: false
      # <setup step for the toolchain, pinned by commit, with the version from the project>
      - name: Install
        run: <install command, from the lockfile: npm ci, uv sync --frozen, ...>
      - name: Lint
        run: <lint command>
      - name: Types
        run: <typecheck command>
      - name: Tests
        run: <test command>
